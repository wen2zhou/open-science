version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      electron:
        patterns:
          - "electron*"
          - "@electron*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      dev-tooling:
        patterns:
          - "eslint*"
          - "prettier*"
          - "typescript*"
          - "vite*"
          - "vitest*"
          - "@vitejs/*"

  # Keep the Action versions pinned in .github/workflows/*.yml current (security + breaking
  # changes land as major bumps). All actions grouped into one PR — low volume, avoids noise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
